services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ticketdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticketdesk}
      POSTGRES_DB: ${POSTGRES_DB:-ticketdesk}
    volumes:
      - pgdata:/var/lib/postgresql/data   # data survives container restarts
    ports:
      - "127.0.0.1:5432:5432"              # reachable from your Mac only, not the network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ticketdesk}:${POSTGRES_PASSWORD:-ticketdesk}@db:5432/${POSTGRES_DB:-ticketdesk}
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret-change-me-this-is-not-for-production}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy        # start only once Postgres accepts connections
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build: ./frontend
    environment:
      API_TARGET: http://api:8000         # where the dev server proxies /api requests to
    volumes:
      - ./frontend/src:/app/src           # edit code on your Mac, the browser reloads live
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api

  # Optional: not started by `docker compose up`. Run it on demand with
  #   docker compose run --rm seed
  seed:
    build: ./backend
    profiles: ["seed"]
    command: ["python", "-m", "app.seed"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ticketdesk}:${POSTGRES_PASSWORD:-ticketdesk}@db:5432/${POSTGRES_DB:-ticketdesk}
    depends_on:
      api:
        condition: service_healthy        # the API container runs migrations on startup

volumes:
  pgdata:
