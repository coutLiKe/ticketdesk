[tool.ruff]
line-length = 100
target-version = "py312"
# Migrations are generated code; don't restyle them.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# E/F = pycodestyle + pyflakes (errors), I = import sorting, B = likely bugs, UP = modern syntax
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# Our folder named "alembic/" would otherwise make ruff treat the library as our own code.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
