# Render Blueprint: describes the API service so it can be created from this repo.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: ticketdesk-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: ohio                    # same area as the Neon database (AWS US East 2, Ohio)
    healthCheckPath: /health        # deliberately does not touch the database (see runbook)
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true         # Render creates a random value and keeps it private
      - key: DATABASE_URL
        sync: false                 # you paste the Neon connection string in the dashboard
      - key: CORS_ORIGINS
        value: https://coutlike.github.io   # the front end's origin (scheme + host, no path)
